<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="tcGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00646E"/>
    </linearGradient>
    <linearGradient id="tcGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="tcGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="128" height="128" rx="26" fill="#F0FDF4" stroke="#0284C7" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- 3D Isometric PLM Cube/Network -->
  <!-- Top Face -->
  <polygon points="64,24 98,42 64,60 30,42" fill="url(#tcGrad2)"/>
  <!-- Left Face -->
  <polygon points="30,42 64,60 64,98 30,80" fill="url(#tcGrad1)"/>
  <!-- Right Face -->
  <polygon points="64,60 98,42 98,80 64,98" fill="url(#tcGrad3)"/>

  <!-- Inner Nodes & Connection Lines -->
  <circle cx="64" cy="42" r="5" fill="#FFFFFF"/>
  <circle cx="47" cy="61" r="4.5" fill="#E0F2FE"/>
  <circle cx="81" cy="61" r="4.5" fill="#E0F2FE"/>
  <circle cx="64" cy="79" r="5.5" fill="#FFFFFF"/>
  <line x1="64" y1="42" x2="64" y2="79" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="2 2"/>
  <line x1="47" y1="61" x2="81" y2="61" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- TC Label Badge -->
  <rect x="36" y="102" width="56" height="18" rx="5" fill="#00646E"/>
  <text x="64" y="115" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TEAMCENTER</text>
</svg>
